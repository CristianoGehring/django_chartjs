<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background-color: #f8f9fa; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 250px; padding: 20px;
            background-color: #343a40; color: #fff;
        }
        .content { margin-left: 250px; padding: 20px; }
        .kpi-card { border: none; border-radius: 15px; color: white; padding: 20px; }
        .kpi-card .value { font-size: 2.5rem; font-weight: bold; }
        .kpi-card .icon { font-size: 3rem; opacity: 0.5; }
        .bg-gradient-1 { background: linear-gradient(45deg, #007bff, #0056b3); }
        .bg-gradient-2 { background: linear-gradient(45deg, #28a745, #1e7e34); }
        .bg-gradient-3 { background: linear-gradient(45deg, #ffc107, #c79100); }
        .bg-gradient-4 { background: linear-gradient(45deg, #17a2b8, #117a8b); }
        .chart-container { background: #fff; padding: 20px; border-radius: 15px; }
        #loading-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.8); z-index: 9999; 
            display: flex; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>

    {% if user.is_authenticated %}
    <div class="sidebar">
        <h2><i class="fas fa-tachometer-alt"></i> Dashboard</h2>
        <hr>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="/"><i class="fas fa-home"></i> Home</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="{% url 'detailed_analysis' %}"><i class="fas fa-chart-pie"></i> Análise Detalhada</a></li>
        </ul>
        <div class="position-absolute bottom-0 mb-3">
            <a href="{% url 'logout' %}" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    {% else %}
        {% block auth_content %}{% endblock %}
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block javascript %}{% endblock %}
</body>
</html>
